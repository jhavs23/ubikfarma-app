}

# ==========================================
# FASE 4: BÚSQUEDA, CHAT Y PROMOCIONES (ACTIVO)
# ==========================================

# --- 13. SearchHistory ---
type SearchHistory
  @model
  @auth(rules: [{ allow: owner }, { allow: groups, groups: ["SUPER_ADMIN"] }]) {
  id: ID!
  user_id: String! @index(name: "byUser")
  search_term: String!
  medicine_name: String
  state: String
  city: String
  created_at: AWSDateTime!
}

# --- 14. ChatMessage ---
type ChatMessage
  @model
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read, create] }
      { allow: groups, groups: ["SUPER_ADMIN"] }
    ]
  ) {
  id: ID!
  quote_request_id: ID! @index(name: "byQuoteRequest")
  sender_id: String!
  sender_type: SenderType!
  message: String!
  read: Boolean!
  created_at: AWSDateTime!
}

# --- 15. Promotion ---
type Promotion
  @model
  @auth(
    rules: [
      { allow: owner }
      { allow: groups, groups: ["SUPER_ADMIN"] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  pharmacy_id: ID! @index(name: "byPharmacy")
  title: String!
  description: String!
  discount_percentage: Float
  discount_fixed_usd: Float
  code: String
  usage_count: Int
  valid_from: AWSDateTime!
  valid_to: AWSDateTime!
  active: Boolean!
  created_at: AWSDateTime!
}